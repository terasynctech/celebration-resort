<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Celebration Resort | Book Now</title>

<link rel="icon" href="logo.png">

<style>

/* BODY */
body {
    margin:0;
    font-family:"Segoe UI", sans-serif;
    background:#0b1220;
    color:white;
}

/* HERO */
.hero {
    height:100vh;
    background:url('https://images.unsplash.com/photo-1566073771259-6a8506099945') center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
}

.hero::after {
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.hero-content {
    position:relative;
    z-index:2;
}

.logo {
    width:110px;
}

h1 {
    color:#facc15;
}

/* SECTION */
.section {
    padding:40px 20px;
    max-width:900px;
    margin:auto;
}

/* CARD */
.card {
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    margin-top:20px;
}

/* INPUT */
input, select {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:none;
}

/* BUTTON */
.btn {
    display:block;
    width:100%;
    margin-top:10px;
    padding:14px;
    border-radius:30px;
    text-align:center;
    text-decoration:none;
    color:white;
    background:linear-gradient(90deg,#facc15,#f97316);
    cursor:pointer;
}

/* FOOTER */
.footer {
    text-align:center;
    padding:20px;
    background:#020617;
    color:#aaa;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
<div class="hero-content">
<img src="logo.png" class="logo">
<h1>Celebration Resort</h1>
<p>Luxury Stay | Banquet | Restaurant</p>
</div>
</div>

<!-- BOOKING FORM -->
<div class="section">
<div class="card">

<h2>📅 Book Your Stay</h2>

<input type="text" id="name" placeholder="Your Name">

<input type="date" id="checkin">
<input type="date" id="checkout">

<select id="guests">
<option>1 Guest</option>
<option>2 Guests</option>
<option>3 Guests</option>
<option>Family</option>
</select>

<select id="room">
<option>Standard Room</option>
<option>Deluxe Room</option>
<option>Luxury Suite</option>
</select>

<button class="btn" onclick="bookNow()">📲 Book via WhatsApp</button>

</div>

<!-- CONTACT FORM -->
<div class="card">
<h2>📧 Send Inquiry</h2>

<input type="email" placeholder="Your Email">
<input type="text" placeholder="Message">

<button class="btn">Send Inquiry</button>

</div>

</div>

<div class="footer">
© Celebration Resort | Powered by TeraSyncTech
</div>

<!-- SCRIPT -->
<script>

function bookNow(){

let name = document.getElementById("name").value;
let checkin = document.getElementById("checkin").value;
let checkout = document.getElementById("checkout").value;
let guests = document.getElementById("guests").value;
let room = document.getElementById("room").value;

let msg = `Hello Celebration Resort,%0A
Name: ${name}%0A
Check-in: ${checkin}%0A
Check-out: ${checkout}%0A
Guests: ${guests}%0A
Room: ${room}`;

window.open(`https://wa.me/916202175653?text=${msg}`, "_blank");

}

</script>

</body>
</html>
